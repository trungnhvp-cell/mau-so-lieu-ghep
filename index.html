];
const F2=x=>(+x.toFixed(2)).toString().replace('.',',');
const DS=[['Thời gian giải một bài toán thực tế (phút) của học sinh',5,5,[4,9,14,8,5]],['Chiều cao (cm) của học sinh nam lớp 12',150,5,[2,6,15,12,5]],['Số tiền ăn sáng (nghìn đồng) mỗi tuần của học sinh',40,20,[5,12,18,10,5]],['Quãng đường (km) từ nhà đến trường của học sinh',0,2,[10,14,9,5,2]],['Thời gian chờ xe buýt (phút) của hành khách',0,4,[12,18,10,6,4]],['Khối lượng (kg) lợn xuất chuồng ở một trang trại',80,10,[3,8,17,9,3]],['Lượng mưa (mm) tháng 7 tại các trạm quan trắc',100,50,[4,7,5,3,1]],['Số bước chân (nghìn) mỗi ngày của người đi bộ',4,2,[3,6,10,7,4]],['Tuổi thọ (nghìn giờ) của bóng đèn LED',8,1,[5,12,20,9,4]],['Điểm thi thử môn Toán của học sinh khối 12',5,1,[2,6,12,9,5]],['Số khách mỗi ngày của một quán cà phê',40,20,[6,10,9,3,2]],['Thời gian tự học (giờ) mỗi tuần của học sinh',0,4,[5,11,14,8,2]],['Nhiệt độ (°C) các ngày hè tại một thành phố',28,2,[3,8,10,6,3]],['Sản lượng sữa (lít/ngày) của đàn bò',10,4,[4,9,13,8,6]],['Doanh thu (triệu đồng) mỗi ngày của một cửa hàng',10,5,[4,8,12,9,7]]];
const NM={mean:'Số trung bình của mẫu số liệu ghép nhóm',R:'Khoảng biến thiên',dq:'Khoảng tứ phân vị',s2:'Phương sai',s:'Độ lệch chuẩn',q1:'Tứ phân vị thứ nhất Q₁',q3:'Tứ phân vị thứ ba Q₃'};
function st(g){const n=g.reduce((s,x)=>s+x[2],0),m=g.reduce((s,x)=>s+x[2]*(x[0]+x[1])/2,0)/n,v=g.reduce((s,x)=>s+x[2]*((x[0]+x[1])/2)**2,0)/n-m*m,q1=qf(g,n,.25),q3=qf(g,n,.75);return{n,mean:m,s2:v,s:Math.sqrt(v),R:g[g.length-1][1]-g[0][0],q1,q3,dq:q3-q1}}
function bd(i,e){const[c,a0,w,f0]=DS[i%15],f=f0.map((_,k)=>f0[(k+e)%5]),g=f.map((x,k)=>[a0+k*w,a0+(k+1)*w,x]),s=st(g);return{c:c+' (số liệu minh họa):',g,s,tb:T(['Nhóm',...g.map(x=>`[${F2(x[0])};${F2(x[1])})`)],[['Tần số',...f]]),e:`n = ${s.n}; x̄ = ${F2(s.mean)}; R = ${F2(s.R)}; Q₁ = ${F2(s.q1)}; Q₃ = ${F2(s.q3)}; Δ<sub>Q</sub> = ${F2(s.dq)}; s² = ${F2(s.s2)}; s = ${F2(s.s)}.`}}
const gm=(b,k,j,e)=>{const v=b.s[k],o=[.82,1.15,1.3].map(x=>F2(v*x)),p=(j+e)%4;o.splice(p,0,F2(v));return M(b.c+b.tb+NM[k]+' là:',o,p,b.e)};
const gf=(b,p)=>{const s=b.s,v=[s.n,s.R,s.mean,s.s],a=[s.n+2,s.R*1.1,s.mean*1.1,s.s*1.2],x=i=>F2(p[i]?v[i]:a[i]);return F(b.c+b.tb+'Xét các phát biểu:',['Cỡ mẫu là '+x(0),'Khoảng biến thiên là '+x(1),'Số trung bình xấp xỉ '+x(2),'Độ lệch chuẩn xấp xỉ '+x(3)],p,b.e)};
const gs=(b,k)=>S(b.c+b.tb+'Tính '+NM[k].toLowerCase()+' (làm tròn đến hàng phần trăm).',+b.s[k].toFixed(2),b.e,.006);
SETS.filter(s=>/^d\d/.test(s.id)).forEach((d,e)=>{d.w=1;const K=['mean','R','dq','s2','s','q1','q3','mean'],P=[[1,1,0,1],[1,0,1,1],[0,1,1,1]],K2=['s','dq','s2','mean'];for(let j=0;j<8;j++)d.qs.push(gm(bd(e*5+j,e),K[(j+e)%8],j,e));for(let j=0;j<3;j++)d.qs.push(gf(bd(e*5+8+j,e),P[(j+e)%3]));for(let j=0;j<4;j++)d.qs.push(gs(bd(e*5+11+j,e),K2[(j+e)%4]));d.qs.sort((a,b)=>'mfs'.indexOf(a.t)-'mfs'.indexOf(b.t))});
const TH=`
<div class=card><h2>1. Mẫu số liệu ghép nhóm</h2><p>Số liệu được chia thành các nhóm [a<sub>i</sub>; a<sub>i+1</sub>) kèm tần số n<sub>i</sub>. Cỡ mẫu n = n₁+…+n<sub>k</sub>. <b>Giá trị đại diện</b> c<sub>i</sub> = (a<sub>i</sub>+a<sub>i+1</sub>)/2. Tần số tích lũy cf<sub>i</sub> = n₁+…+n<sub>i</sub>.</p>
<div class=f>Số trung bình: x̄ = (n₁c₁ + … + n<sub>k</sub>c<sub>k</sub>) / n</div></div>
<div class=card><h2>2. Khoảng biến thiên</h2><div class=f>R = a<sub>k+1</sub> − a₁ (đầu mút phải nhóm cuối − đầu mút trái nhóm đầu)</div></div>
<div class=card><h2>3. Khoảng tứ phân vị</h2><p>Nhóm chứa Q<sub>i</sub> là nhóm đầu tiên có cf ≥ i·n/4 (i = 1; 3). Gọi nhóm đó là [u<sub>m</sub>; u<sub>m+1</sub>), tần số n<sub>m</sub>, cf trước nó là C:</p>
<div class=f>Q<sub>i</sub> = u<sub>m</sub> + [(i·n/4 − C) / n<sub>m</sub>]·(u<sub>m+1</sub> − u<sub>m</sub>)<br>Δ<sub>Q</sub> = Q₃ − Q₁</div></div>
<div class=card><h2>4. Phương sai &amp; độ lệch chuẩn</h2><div class=f>s² = (1/n)·Σ n<sub>i</sub>(c<sub>i</sub> − x̄)² = (1/n)·Σ n<sub>i</sub>c<sub>i</sub>² − x̄²<br>s = √s²</div>
<p><b>So sánh độ phân tán:</b> R, Δ<sub>Q</sub>, s² hoặc s càng nhỏ ⇒ mẫu càng đồng đều. Ý nghĩa thực tiễn: ổn định nhiệt độ, độ rủi ro cổ phiếu, chất lượng sản phẩm…</p></div>
<div class=card><h2>5. Ví dụ mẫu</h2>${tL}<p>n = 25; x̄ = 7,3; Σnᵢcᵢ²/n = 54,97 ⇒ s² = 54,97 − 53,29 = <b>1,68</b>; s ≈ 1,30. Q₁: n/4 = 6,25 → nhóm [6;7): Q₁ = 6 + (6,25−5)/6 ≈ 6,21.</p></div>
<div class=card><h2>6. Máy tính nhanh</h2><p class=mut>Mỗi dòng: <code>đầu trái; đầu phải; tần số</code></p><textarea id=cal rows=6 style="width:100%">5;6;5

function qf(g,n,p){let c=0;for(const x of g){if(c+x[2]>=p*n&&x[2]>0)return x[0]+(p*n-c)/x[2]*(x[1]-x[0]);c+=x[2]}}
function calc(){const g=$('#cal').value.split('\n').map(l=>l.split(/[;\s]+/).map(v=>parseFloat(v.replace(',','.')))).filter(a=>a.length>=3&&a.every(x=>!isNaN(x)));if(!g.length){$('#cres').textContent='Dữ liệu chưa hợp lệ.';return}
const n=g.reduce((s,x)=>s+x[2],0),m=g.reduce((s,x)=>s+x[2]*(x[0]+x[1])/2,0)/n,v=g.reduce((s,x)=>s+x[2]*((x[0]+x[1])/2)**2,0)/n-m*m,q1=qf(g,n,.25),q3=qf(g,n,.75),f=x=>(+x.toFixed(4)).toString().replace('.',',');
$('#cres').innerHTML=T(['n','x̄','R','Q₁','Q₃','Δ_Q','s²','s'],[[n,f(m),f(g[g.length-1][1]-g[0][0]),f(q1),f(q3),f(q3-q1),f(v),f(Math.sqrt(v))]])}

let db=null,user=null,me={name:'',cls:'',uid:''},isT=false,rows=[];
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
me={...me,...ls.get('me',{})};
function who(){$('#who').innerHTML=me.name?`👤 <b>${esc(me.name)}</b> · Lớp <b>${esc(me.cls)}</b> <button class="b g" onclick="editMe()">Đổi</button>`:`<b>Nhập thông tin để lưu điểm</b><div class=st><input id=nm placeholder="Họ và tên"><input id=cl placeholder="Lớp (vd 12A1)" size=10><button class=b onclick="saveMe()">Lưu</button></div>`}
function saveMe(){const n=$('#nm').value.trim(),c=$('#cl').value.trim().toUpperCase();if(!n||!c)return alert('Vui lòng nhập đủ họ tên và lớp');me.name=n;me.cls=c;ls.set('me',me);who()}
function editMe(){me.name='';who()}
let tab='th',timer=null;
function nav(){const t=[['th','📘 Kiến thức'],['pr','✍️ Luyện tập'],['kq','🏆 Kết quả của tôi']];if(isT)t.push(['gv','👩‍🏫 Giáo viên']);$('#nav').innerHTML=t.map(x=>`<button class="${tab==x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(t){tab=t;clearInterval(timer);nav();const v=$('#view');if(t=='th')v.innerHTML=TH;else if(t=='pr')menu();else if(t=='kq')mine();else dash()}
function menu(){let last='',h='';for(const s of SETS){if(s.grp!=last){h+=`</div><h3>${s.grp}</h3><div class=grid>`;last=s.grp}const best=Math.max(0,...ls.get('h',[]).filter(x=>x.id==s.id).map(x=>x.sc));h+=`<div class="card set" onclick="start('${s.id}')"><b>${s.title}</b><br><span class=mut>${s.desc}</span><br><span class=tag>${s.min?'⏱ '+s.min+' phút':'Không giới hạn'}</span> ${best?`<span class=tag>Cao nhất: ${best}</span>`:''}</div>`}
$('#view').innerHTML=h.slice(6)+'</div>'}
let cur,t0,left;
function start(id){if(!me.name)return alert('Hãy nhập họ tên và lớp ở phía trên trước khi làm bài.');cur=SETS.find(s=>s.id==id);t0=Date.now();left=cur.min*60;
$('#view').innerHTML=`${cur.min?'<div id=timer><span>⏱ <span id=tm></span></span><span>'+cur.title+'</span></div>':''}<div class=card><h2>${cur.title}</h2><div id=qs>${cur.qs.map(qh).join('')}</div><p><button class=b id=sub onclick="submit()">Nộp bài</button> <button class="b g" onclick="go('pr')">Thoát</button></p><div id=res></div></div>`;
if(cur.min){tick();timer=setInterval(()=>{left--;tick();if(left<=0)submit(true)},1000)}}
function tick(){$('#tm').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}
function qh(q,i){let h=`<div class=q id=q${i}><b>Câu ${i+1}.</b> ${q.q}`;
if(q.t=='m')h+=q.o.map((o,j)=>`<label><input type=radio name=q${i} value=${j}> <b>${'ABCD'[j]}.</b> ${o}</label>`).join('');
if(q.t=='f')h+=q.s.map((s,j)=>`<div class=st><span class=s>${'abcd'[j]}) ${s}</span><label><input type=radio name=q${i}_${j} value=1> Đúng</label><label><input type=radio name=q${i}_${j} value=0> Sai</label></div>`).join('');
if(q.t=='s')h+=`<div class=st><input name=q${i} inputmode=decimal placeholder="Đáp số" size=12></div>`;
return h+'<div class=ex hidden></div></div>'}
function submit(auto){if(!cur)return;clearInterval(timer);const c=cur;cur=null;let pts=0,ok=0;
c.qs.forEach((q,i)=>{const d=$('#q'+i),ex=d.querySelector('.ex');let r=0,ans='';
if(q.t=='m'){const x=d.querySelector(`input[name=q${i}]:checked`);r=x&&+x.value==q.a?1:0;ans='Đáp án: '+'ABCD'[q.a];d.querySelectorAll('label').forEach((l,j)=>{if(j==q.a)l.classList.add('ok');else if(l.querySelector('input').checked)l.classList.add('bad')})}
if(q.t=='f'){let k=0;q.a.forEach((a,j)=>{const x=d.querySelector(`input[name=q${i}_${j}]:checked`);if(x&&+x.value==a)k++});r=c.w?[0,.1,.25,.5,1][k]:k/4;ans='Đáp án: '+q.a.map((a,j)=>'abcd'[j]+(a?'-Đ':'-S')).join(', ')+` (đúng ${k}/4)`}
if(q.t=='s'){const v=parseFloat(d.querySelector('input').value.replace(',','.'));r=Math.abs(v-q.a)<=q.tol?1:0;ans='Đáp số: '+String(q.a).replace('.',',')}
pts+=r*(c.w?{m:.25,f:1,s:.5}[q.t]:1);if(r==1)ok++;d.classList.add(r==1?'':'');ex.hidden=false;ex.innerHTML=(r==1?'✅ ':r>0?'🟡 ':'❌ ')+'<b>'+ans+'</b><br>'+q.e;d.querySelectorAll('input').forEach(x=>x.disabled=true)});
const sc=Math.round(pts/(c.w?10:c.qs.length)*1000)/100,sec=Math.round((Date.now()-t0)/1000);$('#sub').hidden=true;
const rec={id:c.id,title:c.title,cls:me.cls,name:me.name,sc,ok,tot:c.qs.length,sec,ts:Date.now()};
const h=ls.get('h',[]);h.push(rec);ls.set('h',h);if(db){db.collection('results').add({...rec,uid:me.uid}).catch(()=>{})}
$('#res').innerHTML=`<div class=card><div class=sc>${String(sc).replace('.',',')}/10</div>${auto?'<p>Hết giờ, bài đã được nộp tự động.</p>':''}<p>Đúng hoàn toàn ${ok}/${c.qs.length} câu · Thời gian ${Math.floor(sec/60)}p${sec%60}s ${db?'· Điểm đã gửi cho giáo viên':'· (lưu trên máy này)'}</p></div>`;$('#res').scrollIntoView({behavior:'smooth'})}
function mine(){const h=ls.get('h',[]).slice().reverse();$('#view').innerHTML=`<div class=card><h2>Lịch sử làm bài</h2>`+(h.length?`<p>Số lần làm: <b>${h.length}</b> · Điểm trung bình: <b>${(h.reduce((s,x)=>s+x.sc,0)/h.length).toFixed(2).replace('.',',')}</b></p>`+T(['Bài','Điểm','Đúng','Thời gian','Ngày'],h.map(x=>[esc(x.title),x.sc,x.ok+'/'+x.tot,Math.floor(x.sec/60)+'p'+x.sec%60+'s',new Date(x.ts).toLocaleDateString('vi-VN')])):'<p class=mut>Chưa có bài nào.</p>')+'</div>'}
function dash(){const cls=[...new Set(rows.map(r=>r.cls))].sort(),f=window.fc||'';const R=rows.filter(r=>!f||r.cls==f);
const by={};R.forEach(r=>{const k=r.cls+'|'+r.name;(by[k]=by[k]||[]).push(r)});
const avg=a=>a.reduce((s,x)=>s+x.sc,0)/a.length,fm=x=>x.toFixed(2).replace('.',',');
const cs=cls.map(c=>{const a=rows.filter(r=>r.cls==c);return[esc(c),new Set(a.map(r=>r.name)).size,a.length,`<div class=bar style="width:${avg(a)*10}%"></div> ${fm(avg(a))}`]});
const ss=Object.values(by).map(a=>[esc(a[0].name),esc(a[0].cls),a.length,fm(avg(a)),Math.max(...a.map(x=>x.sc)),esc(a[a.length-1].title)]).sort((x,y)=>parseFloat(y[3])-parseFloat(x[3]));
$('#view').innerHTML=`<div class=card><h2>Thống kê của giáo viên</h2><p class=mut>${rows.length} bài nộp · cập nhật trực tiếp</p><h3>Theo lớp</h3>${cs.length?T(['Lớp','Số HS','Số bài','Điểm TB'],cs):'<p>Chưa có dữ liệu.</p>'}
<h3>Theo học sinh</h3><select onchange="window.fc=this.value;dash()"><option value="">Tất cả lớp</option>${cls.map(c=>`<option ${c==f?'selected':''}>${esc(c)}</option>`).join('')}</select>${T(['Học sinh','Lớp','Số bài','ĐTB','Cao nhất','Bài gần nhất'],ss)}
<h3>Bài làm mới nhất</h3>${T(['Thời gian','Học sinh','Lớp','Bài','Điểm'],R.slice().sort((a,b)=>b.ts-a.ts).slice(0,30).map(r=>[new Date(r.ts).toLocaleString('vi-VN'),esc(r.name),esc(r.cls),esc(r.title),r.sc]))}</div>`}
who();nav();go('th');
(async()=>{try{user=await claude.use('user');if(user){me.uid=await user.id();isT=user.canEdit()||user.isOwner()}
db=await claude.use('db');if(db&&isT){db.collection('results').onSnapshot(s=>{rows=s.docs.map(d=>d.data());if(tab=='gv')dash()},()=>{})}}catch(e){}nav()})();
